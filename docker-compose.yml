services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iw_user
      # Domyślne hasło dev — kontener startuje bez .env. Nadpisz w produkcji.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iw_dev_password}
      POSTGRES_DB: ironwarriors
    ports:
      # Baza dostępna tylko na localhost (dev), nie wystawiona publicznie.
      - "127.0.0.1:55432:5432"
    volumes:
      - iw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iw_user -d ironwarriors"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://iw_user:${POSTGRES_PASSWORD:-iw_dev_password}@postgres:5432/ironwarriors
      # Domyślny sekret dev — kontener startuje bez .env. Nadpisz w produkcji.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-development-secret-change-before-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Za reverse proxy: zob. MAINTENANCE.md (limit logowania wg adresu klienta).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      AUTH_IP_HEADER: ${AUTH_IP_HEADER:-}
    ports:
      # Tylko localhost: ruch z internetu idzie przez reverse proxy z HTTPS, nigdy prosto do Node.
      # Bezpośredni dostęp pozwalałby podrobić X-Forwarded-For i obejść limit logowania.
      - "127.0.0.1:3000:3000"
    volumes:
      - iw-app-uploads:/app/public/uploads

volumes:
  iw-postgres-data:
  iw-app-uploads:
