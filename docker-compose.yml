services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iw_user
      # Wymagane — brak wartości przerywa start zamiast używać publicznego hasła.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}
      POSTGRES_DB: ironwarriors
    ports:
      # Baza dostępna tylko na localhost (dev), nie wystawiona publicznie.
      - "127.0.0.1:55432:5432"
    volumes:
      - iw-postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iw_user -d ironwarriors"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    # ADMIN_NAME/ADMIN_EMAIL/ADMIN_PASSWORD trafiają do kontenera wprost z .env.
    # Nie używamy ${ADMIN_EMAIL:-}, bo przy braku zmiennej Compose wstrzykiwałby
    # puste wartości i seed nie odróżniłby „brak” od „ustawione na pusto”.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://iw_user:${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w .env}@postgres:5432/ironwarriors
      # Wymagane — brak wartości przerywa start zamiast używać sekretu z repozytorium.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Ustaw BETTER_AUTH_SECRET w .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Za reverse proxy: zob. MAINTENANCE.md (limit logowania wg adresu klienta).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      AUTH_IP_HEADER: ${AUTH_IP_HEADER:-}
    ports:
      # Tylko localhost: ruch z internetu idzie przez reverse proxy z HTTPS, nigdy prosto do Node.
      # Bezpośredni dostęp pozwalałby podrobić X-Forwarded-For i obejść limit logowania.
      - "127.0.0.1:3000:3000"
    volumes:
      - iw-app-uploads:/app/public/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g

volumes:
  iw-postgres-data:
  iw-app-uploads:
