services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iw_user
      # Wymagane — brak wartości domyślnej (fail-fast zamiast słabego hasła).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w środowisku}
      POSTGRES_DB: ironwarriors
    ports:
      # Baza dostępna tylko na localhost (dev), nie wystawiona publicznie.
      - "127.0.0.1:55432:5432"
    volumes:
      - iw-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iw_user -d ironwarriors"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://iw_user:${POSTGRES_PASSWORD:?Ustaw POSTGRES_PASSWORD w środowisku}@postgres:5432/ironwarriors
      # Wymagane — brak wartości domyślnej (fail-fast zamiast przewidywalnego sekretu).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Ustaw BETTER_AUTH_SECRET w środowisku}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - iw-app-uploads:/app/public/uploads

volumes:
  iw-postgres-data:
  iw-app-uploads:
