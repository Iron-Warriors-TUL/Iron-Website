name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: iw_user
          POSTGRES_PASSWORD: iw_dev_password
          POSTGRES_DB: ironwarriors
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U iw_user -d ironwarriors"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://iw_user:iw_dev_password@localhost:55432/ironwarriors
      # Sekret tylko dla CI, nie używany nigdzie poza tym jobem.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-in-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Build prerenderuje strony z bazy, więc najpierw migracje i seed.
      - name: Migrate and seed database
        run: pnpm db:migrate && pnpm db:seed

      - name: Build
        run: pnpm build
